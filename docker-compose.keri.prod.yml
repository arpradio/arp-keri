## KERI production stack: KERIA agent + 6 independently-keyed witnesses.
##
## Standalone file, not a `-f base -f prod` overlay on docker-compose.keri.yml:
## Compose merges list-type keys (`ports`, `volumes`) across `-f` layers by
## concatenation, not replacement, so an overlay can't actually remove the
## dev file's host-published debug ports — the two files would need to
## disagree on whether KERIA/witnesses are publicly reachable, and
## concatenation always wins toward "published." Standalone avoids that trap.
##
## Run: docker compose -f infra/docker-compose.keri.prod.yml up -d
##
## Requires, in the environment docker compose reads (.env or the shell):
##   WITNESS_W1_BRAN .. WITNESS_W6_BRAN   (scripts/generate-keri-witness-keys.ts)
##   KERIA_BOOT_USERNAME, KERIA_BOOT_PASSWORD   (HTTP Basic auth on the boot port)
##   KERIA_PASSCODE   encrypts KERIA's own keystore; 21+ alphanumeric chars.
##                    Set before first start and never change or lose it —
##                    the keria-data volume can't be opened without it.
##   EDGE_PROXY_IP    LAN IP of the edge nginx VM. KERIA reaches the
##                    witnesses at their public w1..w6.arpradio.media URLs;
##                    this pins those names to the edge VM so the traffic
##                    stays on the LAN instead of relying on hairpin NAT.
## Optional:
##   KERIA_BIND_IP   host IP to publish KERIA's and the witnesses' ports on.
##                   deploy.sh detects it automatically; unset means all
##                   interfaces (0.0.0.0).
##
## No TLS or reverse-proxy nginx in this stack — this host (the KERI VM)
## sits behind a shared edge nginx VM on a private network that already
## terminates TLS for arpradio.media's other subdomains and does
## hostname-based L7 routing to backend VMs. KERIA's three ports and each
## witness's HTTP port are published to this VM's own host IP
## (KERIA_BIND_IP, see `ports` below) so that edge VM can proxy_pass
## straight to them — see infra/nginx/keria.conf for the server blocks to
## add there, and infra/README.md for the full topology. Witness TCP ports
## (5643) stay unpublished; KERIA and signify only use HTTP.

x-healthcheck: &healthcheck
    interval: 2s
    timeout: 3s
    retries: 5
    start_period: 2s

x-python-env: &python-env
    PYTHONUNBUFFERED: 1
    PYTHONIOENCODING: UTF-8

x-witness: &witness
    image: ${KERI_IMAGE:-weboftrust/keri}:${KERI_IMAGE_TAG:-1.2.13}
    environment:
        <<: *python-env
    restart: unless-stopped

services:
    keria:
        image: ${KERIA_IMAGE:-weboftrust/keria}:${KERIA_IMAGE_TAG:-0.4.0}
        environment:
            KERI_AGENT_CORS: 1
            # Boot (agent creation) is unauthenticated unless BOTH of these are
            # set. Required, not defaulted: an empty string still switches
            # KERIA's check on and then rejects every request.
            KERIA_EXPERIMENTAL_BOOT_USERNAME: ${KERIA_BOOT_USERNAME:?set KERIA_BOOT_USERNAME}
            KERIA_EXPERIMENTAL_BOOT_PASSWORD: ${KERIA_BOOT_PASSWORD:?set KERIA_BOOT_PASSWORD}
            KERIA_PASSCODE: ${KERIA_PASSCODE:?set KERIA_PASSCODE}
            <<: *python-env
        volumes:
            - ./config/keria.prod.json:/keria/config/keri/cf/keria.json
            - keria-data:/usr/local/var/keri
        command: start --config-dir /keria/config --config-file keria --name keria
        healthcheck:
            test: wget --spider http://keria:3902/spec.yaml
            <<: *healthcheck
        restart: unless-stopped
        # Published to the host IP in KERIA_BIND_IP (deploy.sh detects the
        # VM's primary private IP) so the edge nginx VM can reach them over
        # the private network. Falls back to all interfaces if unset.
        # KERIA's port roles: 3901 admin, 3902 mailbox/http/OOBI, 3903 boot.
        ports:
            - '${KERIA_BIND_IP:-0.0.0.0}:3901:3901'
            - '${KERIA_BIND_IP:-0.0.0.0}:3902:3902'
            - '${KERIA_BIND_IP:-0.0.0.0}:3903:3903'
        # The witnesses advertise public URLs (config/witness-prod/*.json),
        # and KERIA sends receipt requests to those URLs. Resolve them to the
        # edge VM's LAN IP so that works without hairpin NAT on the router.
        extra_hosts:
            - 'w1.arpradio.media:${EDGE_PROXY_IP:?set EDGE_PROXY_IP}'
            - 'w2.arpradio.media:${EDGE_PROXY_IP:?set EDGE_PROXY_IP}'
            - 'w3.arpradio.media:${EDGE_PROXY_IP:?set EDGE_PROXY_IP}'
            - 'w4.arpradio.media:${EDGE_PROXY_IP:?set EDGE_PROXY_IP}'
            - 'w5.arpradio.media:${EDGE_PROXY_IP:?set EDGE_PROXY_IP}'
            - 'w6.arpradio.media:${EDGE_PROXY_IP:?set EDGE_PROXY_IP}'

    witness-1:
        <<: *witness
        command: witness start --alias w1 --passcode ${WITNESS_W1_BRAN} --http 5642 --tcp 5643 --config-dir /config --config-file w1 --no-prompt
        healthcheck:
            test: wget --spider http://127.0.0.1:5642/oobi
            <<: *healthcheck
        volumes:
            - ./config/witness-prod/w1.json:/config/main/w1.json
            - witness1-data:/usr/local/var/keri
        # HTTP only, on host port 5642; the edge VM proxies w1.arpradio.media here.
        ports:
            - '${KERIA_BIND_IP:-0.0.0.0}:5642:5642'

    witness-2:
        <<: *witness
        command: witness start --alias w2 --passcode ${WITNESS_W2_BRAN} --http 5642 --tcp 5643 --config-dir /config --config-file w2 --no-prompt
        healthcheck:
            test: wget --spider http://127.0.0.1:5642/oobi
            <<: *healthcheck
        volumes:
            - ./config/witness-prod/w2.json:/config/main/w2.json
            - witness2-data:/usr/local/var/keri
        ports:
            - '${KERIA_BIND_IP:-0.0.0.0}:5643:5642'

    witness-3:
        <<: *witness
        command: witness start --alias w3 --passcode ${WITNESS_W3_BRAN} --http 5642 --tcp 5643 --config-dir /config --config-file w3 --no-prompt
        healthcheck:
            test: wget --spider http://127.0.0.1:5642/oobi
            <<: *healthcheck
        volumes:
            - ./config/witness-prod/w3.json:/config/main/w3.json
            - witness3-data:/usr/local/var/keri
        ports:
            - '${KERIA_BIND_IP:-0.0.0.0}:5644:5642'

    witness-4:
        <<: *witness
        command: witness start --alias w4 --passcode ${WITNESS_W4_BRAN} --http 5642 --tcp 5643 --config-dir /config --config-file w4 --no-prompt
        healthcheck:
            test: wget --spider http://127.0.0.1:5642/oobi
            <<: *healthcheck
        volumes:
            - ./config/witness-prod/w4.json:/config/main/w4.json
            - witness4-data:/usr/local/var/keri
        ports:
            - '${KERIA_BIND_IP:-0.0.0.0}:5645:5642'

    witness-5:
        <<: *witness
        command: witness start --alias w5 --passcode ${WITNESS_W5_BRAN} --http 5642 --tcp 5643 --config-dir /config --config-file w5 --no-prompt
        healthcheck:
            test: wget --spider http://127.0.0.1:5642/oobi
            <<: *healthcheck
        volumes:
            - ./config/witness-prod/w5.json:/config/main/w5.json
            - witness5-data:/usr/local/var/keri
        ports:
            - '${KERIA_BIND_IP:-0.0.0.0}:5646:5642'

    witness-6:
        <<: *witness
        command: witness start --alias w6 --passcode ${WITNESS_W6_BRAN} --http 5642 --tcp 5643 --config-dir /config --config-file w6 --no-prompt
        healthcheck:
            test: wget --spider http://127.0.0.1:5642/oobi
            <<: *healthcheck
        volumes:
            - ./config/witness-prod/w6.json:/config/main/w6.json
            - witness6-data:/usr/local/var/keri
        ports:
            - '${KERIA_BIND_IP:-0.0.0.0}:5647:5642'

volumes:
    keria-data:
    witness1-data:
    witness2-data:
    witness3-data:
    witness4-data:
    witness5-data:
    witness6-data:
