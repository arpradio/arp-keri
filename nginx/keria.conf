# Reverse proxy for KERIA's three ports, running as the `nginx` service in
# docker-compose.keri.prod.yml. Terminates TLS for the three keria.*
# subdomains using certs obtained by the `certbot` service (see
# nginx/init-letsencrypt.sh and infra/README.md for the one-time bootstrap).
#
# `proxy_pass` targets the `keria` container by its Compose service name —
# this file only works mounted into the `nginx` service defined alongside
# `keria` in the same compose file / network.
#
# keria.arpradio.media is the one that matters most: it's what KERIA
# advertises as its own OOBI/curl (see infra/config/keria.prod.json), so
# it's the address the browser client and any other KERI agent will
# actually resolve to reach this identity's KEL.

# Plain-HTTP: serves the ACME HTTP-01 challenge for cert issuance/renewal,
# redirects everything else to HTTPS. One block handles all three
# subdomains since the challenge path and redirect logic are identical.
server {
    listen 80;
    listen [::]:80;
    server_name keria.arpradio.media keria-boot.arpradio.media keria-admin.arpradio.media;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name keria.arpradio.media;

    ssl_certificate     /etc/letsencrypt/live/keria.arpradio.media/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keria.arpradio.media/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparam.pem;

    location / {
        proxy_pass http://keria:3902;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name keria-boot.arpradio.media;

    ssl_certificate     /etc/letsencrypt/live/keria.arpradio.media/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keria.arpradio.media/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparam.pem;

    location / {
        proxy_pass http://keria:3901;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name keria-admin.arpradio.media;

    ssl_certificate     /etc/letsencrypt/live/keria.arpradio.media/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keria.arpradio.media/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparam.pem;

    location / {
        proxy_pass http://keria:3903;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
