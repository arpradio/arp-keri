# Reverse proxy for KERIA's three ports — add these blocks to the edge
# nginx VM's config (the one that already terminates TLS for
# dandelion.arpradio.media / arpnode-mainnet.duckdns.org and proxy_passes
# to backend VMs over the private network). This is NOT part of the KERI
# VM's own docker-compose stack — the KERI VM has no direct public
# reachability; the edge VM does hostname-based L7 routing to it, the same
# way it already does for the dandelion backend at 192.168.0.126.
#
# `proxy_pass` targets the KERI VM's private IP (192.168.0.241) directly on
# KERIA's three published ports (see docker-compose.keri.prod.yml's `ports`
# entries on the `keria` service).
#
# keria.arpradio.media is the one that matters most: it's what KERIA
# advertises as its own OOBI/curl (see infra/config/keria.prod.json), so
# it's the address the browser client and any other KERI agent will
# actually resolve to reach this identity's KEL.
#
# These are plain-HTTP server blocks by design — run
#   sudo certbot --nginx -d keria.arpradio.media -d keria-boot.arpradio.media -d keria-admin.arpradio.media
# once they're in place (and DNS for all three actually points at this
# edge VM), the same way the existing arpnode-mainnet.duckdns.org /
# dandelion.arpradio.media blocks were set up — certbot will rewrite this
# file in place to add the "listen 443 ssl" blocks, the cert directives,
# and the port-80-to-443 redirect. Don't hand-write the SSL blocks
# yourself; let certbot generate them so the paths match what it issues.

server {
    listen 80;
    server_name keria.arpradio.media;

    location / {
        proxy_pass http://192.168.0.241:3902;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name keria-boot.arpradio.media;

    location / {
        proxy_pass http://192.168.0.241:3901;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name keria-admin.arpradio.media;

    location / {
        proxy_pass http://192.168.0.241:3903;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
